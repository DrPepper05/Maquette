<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Maquette — randor offline</title>
<style>
  html,body{margin:0;background:#0B0C0F;overflow:hidden}
  canvas{display:block}
</style>
<script type="importmap">
{"imports":{
  "three":"/node_modules/three/build/three.module.js",
  "three/addons/":"/node_modules/three/examples/jsm/"
}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const SIZE = 1100;                 // se randează mare, se micșorează la export
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.58;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = null;

// mediu de studio, generat — fără fișier HDR extern
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.42;

const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 200);

// ─── lumini ───────────────────────────────────────────────────
const key = new THREE.DirectionalLight(0xffe9d6, 1.7);
key.position.set(-5.5, 9.5, 3.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1; key.shadow.camera.far = 40;
key.shadow.camera.left = -9; key.shadow.camera.right = 9;
key.shadow.camera.top = 9; key.shadow.camera.bottom = -9;
key.shadow.bias = -0.0008;
scene.add(key);

const rim = new THREE.DirectionalLight(0xa8c4e8, 1.05);
rim.position.set(7, 3, -7);
scene.add(rim);

scene.add(new THREE.AmbientLight(0xffffff, 0.10));

const redFill = new THREE.PointLight(0xD9573A, 5, 14, 2);
redFill.position.set(0, -1.2, 2.4);
scene.add(redFill);

// ─── materiale ────────────────────────────────────────────────
const glass = (tint) => new THREE.MeshPhysicalMaterial({
  color: tint, metalness: 0, roughness: 0.08,
  transmission: 0.96, thickness: 0.9, ior: 1.48,
  clearcoat: 1, clearcoatRoughness: 0.06,
  transparent: true, opacity: 1,
  attenuationColor: new THREE.Color(0x1a2028), attenuationDistance: 1.5,
});
const steel = new THREE.MeshStandardMaterial({ color: 0x9aa1ab, metalness: 1, roughness: 0.22 });
const dark  = new THREE.MeshStandardMaterial({ color: 0x14171C, metalness: 0.85, roughness: 0.38 });
const glow  = new THREE.MeshStandardMaterial({
  color: 0xD9573A, emissive: 0xD9573A, emissiveIntensity: 4.2,
  metalness: 0, roughness: 0.4,
});
const glowSoft = new THREE.MeshStandardMaterial({
  color: 0xEFEBE3, emissive: 0xEFEBE3, emissiveIntensity: 1.5,
  metalness: 0, roughness: 0.5,
});

const root = new THREE.Group();
scene.add(root);

// ─── placa de bază ────────────────────────────────────────────
const base = new THREE.Mesh(new THREE.BoxGeometry(5.5, 0.20, 3.8), dark);
base.position.y = -2.35;
base.receiveShadow = true;
root.add(base);

const baseEdge = new THREE.Mesh(new THREE.BoxGeometry(5.5, 0.03, 0.05), glow);
baseEdge.position.set(0, -2.26, 1.9);
root.add(baseEdge);

// ─── straturile ───────────────────────────────────────────────
const N = 5;
const layers = [];
const rnd = mulberry(90210);

for (let i = 0; i < N; i++) {
  const w = 4.5 - i * 0.42, d = 3.0 - i * 0.28, h = 0.13;
  const g = new THREE.Group();

  const slab = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), glass(0x6f8299));
  slab.castShadow = true; slab.receiveShadow = true;
  g.add(slab);

  // cadru metalic subțire pe conturul plăcii
  const frame = new THREE.Mesh(
    new THREE.BoxGeometry(w + 0.05, h + 0.055, d + 0.05),
    i === 2 ? glow : steel
  );
  frame.material = i === 2 ? glow : steel;
  frame.scale.set(1, 1, 1);
  const frameEdges = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, d)),
    new THREE.LineBasicMaterial({ color: i === 2 ? 0xD9573A : 0xB9C0CA, transparent: true, opacity: 0.9 })
  );
  g.add(frameEdges);

  root.add(g);

  layers.push({
    g, slab,
    stacked: new THREE.Vector3(0, -1.55 + i * 0.78, 0),
    scattered: new THREE.Vector3((rnd() - 0.5) * 5.6, (rnd() - 0.5) * 4.2, (rnd() - 0.5) * 3.6),
    rotS: new THREE.Euler((rnd() - 0.5) * 1.5, (rnd() - 0.5) * 2.6, (rnd() - 0.5) * 1.1),
    phase: rnd() * 6.28,
  });
}

// ─── pini de colț ─────────────────────────────────────────────
const pins = [];
for (const [x, z] of [[-1.75, -1.05], [1.75, -1.05], [-1.75, 1.05], [1.75, 1.05]]) {
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, 3.35, 14), steel);
  p.position.set(x, -0.15, z);
  p.castShadow = true;
  root.add(p);
  pins.push(p);
}

// ─── interfața de pe placa de sus ─────────────────────────────
const uiGroup = new THREE.Group();
const uiDefs = [
  [-1.55, 0.62, 3.1, 0.16, false],
  [-1.55, -0.18, 0.62, 1.28, false],
  [-0.62, 0.20, 2.02, 0.20, true],
  [-0.62, -0.18, 2.02, 0.16, false],
  [-0.62, -0.56, 1.42, 0.16, false],
];
for (const [x, y, w, h, hot] of uiDefs) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.018, h), hot ? glow : glowSoft);
  m.position.set(x + w / 2, 0, y);
  uiGroup.add(m);
}
uiGroup.position.y = -1.55 + (N - 1) * 0.78 + 0.08;
root.add(uiGroup);

// ─── compunere: bloom ─────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.setSize(SIZE, SIZE);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(SIZE, SIZE), 0.26, 0.45, 0.94);
composer.addPass(bloom);
composer.addPass(new OutputPass());

camera.aspect = 1; camera.updateProjectionMatrix();

const tmp = new THREE.Vector3();

function setFrame(t) {
  const a = smooth(clamp(t / 0.46, 0, 1));       // împrăștiat → stivă
  const c = smooth(clamp((t - 0.56) / 0.44, 0, 1)); // stivă → vedere frontală, interfața se aprinde

  layers.forEach((L, i) => {
    tmp.copy(L.scattered).lerp(L.stacked, a);
    if (a < 1) {
      const d = (1 - a) * 0.3;
      tmp.x += Math.sin(t * 9 + L.phase) * d;
      tmp.y += Math.cos(t * 7 + L.phase * 1.6) * d;
    }
    L.g.position.copy(tmp);
    L.g.rotation.set(
      lerp(L.rotS.x, 0, a), lerp(L.rotS.y, 0, a), lerp(L.rotS.z, 0, a)
    );
    const s = lerp(0.72, 1, a);
    L.g.scale.setScalar(s);
    L.slab.material.opacity = 1;
  });

  pins.forEach((p) => { p.scale.y = a; p.visible = a > 0.04; });
  base.visible = baseEdge.visible = a > 0.02;
  base.position.y = -2.35 + (1 - a) * 1.2;
  baseEdge.position.y = base.position.y + 0.09;

  uiGroup.children.forEach((m, i) => {
    const k = clamp((c - i * 0.06) / 0.42, 0, 1);
    m.scale.set(k, 1, 1);
    m.position.x = uiDefs[i][0] + (uiDefs[i][2] * k) / 2;
    m.visible = k > 0.01;
  });
  glow.emissiveIntensity = 0.7 + c * 2.0;
  glowSoft.emissiveIntensity = 0.1 + c * 0.75;
  redFill.intensity = 1.2 + c * 3.2;
  bloom.strength = 0.22 + c * 0.30;

  // camera: din colț, sus → aproape frontal, jos
  const ang = lerp(-0.92, -0.40, c);
  const dist = lerp(lerp(15.0, 12.8, a), 11.6, c);
  const hgt = lerp(lerp(5.2, 4.2, a), 5.6, c);
  camera.position.set(Math.sin(ang) * dist, hgt, Math.cos(ang) * dist);
  camera.lookAt(0, lerp(-0.1, 0.55, c), 0);

  root.rotation.y = lerp(0.42, 0.02, c);

  composer.render();
}

window.setFrame = (t) => { setFrame(t); return true; };
window.ready = true;
setFrame(0);

// ─── export automat al secvenței ──────────────────────────────
window.progress = 0;
window.renderSequence = async (count) => {
  window.progress = 0;
  for (let i = 0; i < count; i++) {
    setFrame(i / (count - 1));
    const blob = await new Promise((r) => renderer.domElement.toBlob(r, 'image/png'));
    await fetch('http://127.0.0.1:8100/f' + String(i).padStart(3, '0'), { method: 'POST', body: blob });
    window.progress = i + 1;
  }
  window.done = true;
  return count;
};

function clamp(v,a,b){return Math.min(b,Math.max(a,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function smooth(t){return t*t*(3-2*t);}
function mulberry(seed){return function(){seed|=0;seed=(seed+0x6D2B79F5)|0;let x=Math.imul(seed^(seed>>>15),1|seed);x=(x+Math.imul(x^(x>>>7),61|x))^x;return((x^(x>>>14))>>>0)/4294967296;};}
</script>
</body>
</html>
