<section id="album" aria-label="Project Album">
  <!-- HERO: full-viewport landing -->
  <div class="album-hero">
    <div class="album-content wrap">
      <div class="album-text">
        <span class="mono">Selected projects</span>
        <h1>The<br>collection.</h1>
        <p class="lead">Five pieces from the studio — websites, automations and software, each one a real product built for a real team.</p>
        <div class="album-thumbs" id="albumThumbs" aria-label="Project thumbnails">
          <!-- JS fills thumbnail strip -->
        </div>
      </div>
      <div class="album-feature" id="albumFeature">
        <div class="album-painting" id="albumPainting" aria-hidden="true">
          <!-- JS applies artwork gradient bg -->
        </div>
        <div class="album-painting-meta" id="albumPaintingMeta">
          <span class="sc-kick" id="albumMetaKick">Software · 2026</span>
          <h3 id="albumMetaTitle">Northwind</h3>
          <p class="sc-desc" id="albumMetaDesc">Fleet operations, one screen.</p>
        </div>
      </div>
    </div>
    <div class="album-scroll-hint" id="albumScrollHint">
      <span>Scroll to explore</span>
      <div class="album-scroll-mouse">
        <div class="album-scroll-dot"></div>
      </div>
    </div>
  </div>
</section>
