<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery Component Preview – Maquette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=DM+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="gallery.css">
</head>
<body>
<!-- component: gallery -->
<section id="work">
  <div class="wrap work-intro">
    <h2>The collection.</h2>
    <p class="note">Sample entries for now. Drag sideways, scroll horizontally or use the arrows to walk the gallery.</p>
  </div>
  <div class="showcase" id="showcase" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Selected work">
    <div class="room" id="room" aria-hidden="true"></div>
    <div class="perspective">
      <svg class="trail" aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none">
        <g id="trailG" fill="none" stroke="#d9915b" stroke-width="1.1">
          <path class="trail-a" id="trailA" vector-effect="non-scaling-stroke"/>
          <path class="trail-b" id="trailB" vector-effect="non-scaling-stroke"/>
          <path class="trail-c" id="trailC" vector-effect="non-scaling-stroke" stroke-width=".8"/>
        </g>
      </svg>
      <div class="pieces" id="pieces"></div>
    </div>
    <canvas class="crumple" id="crumple" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>
    <div class="showcase-top" aria-hidden="true">
      <span class="sc-brand">The gallery</span>
      <span class="sc-kicker">Selected work</span>
    </div>
    <aside class="showcase-meta" id="meta">
      <div id="metaInner">
        <p class="sc-kick" id="metaKick">Software · 2026</p>
        <h3 id="metaTitle">Northwind</h3>
        <p class="sc-desc" id="metaDesc">Northwind Logistics — Fleet operations, one screen.</p>
      </div>
    </aside>
    <div class="showcase-controls">
      <button type="button" id="prev" aria-label="Previous project">←</button>
      <button type="button" id="next" aria-label="Next project">→</button>
      <span class="sc-count" id="count">01 — 05</span>
    </div>
    <div class="showcase-stack" id="stack" aria-hidden="true">Next.js · Postgres · tRPC</div>
    <p class="sr-only" id="live" aria-live="polite"></p>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="gallery.js"></script>
</body>
</html>
