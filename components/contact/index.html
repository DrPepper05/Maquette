<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact Component Preview (Portfolio Standard) – Maquette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="contact.css">
</head>
<body>
<!-- component: contact -->
<section id="contact" class="chamber" style="--tint:#2b1216;padding-top:clamp(56px,8vw,96px)">
  <div class="wrap">
    <div class="rtop" style="border-top: none; padding-top: 0;">
      <span class="sc-brand">The salon</span>
      <span class="sc-kicker">Free prototype inquiry</span>
    </div>
    <div class="box">
      <div>
        <span class="eyebrow">Start here</span>
        <h2>Let’s discuss your prototype.</h2>
        <p class="lead">Four short fields. We reply within one working day, usually with a call invitation.</p>
        <p class="mono" style="margin-top: 24px;"><a href="mailto:contact@maquette.ro">contact@maquette.ro</a></p>
      </div>
      <form id="f" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="e4fcc064-c39f-4709-b4b2-be2980dcea64">
        <input type="hidden" name="subject" value="New Prototype Request from Maquette.ro">
        <input type="hidden" name="from_name" value="Maquette Website">
        <input type="checkbox" name="botcheck" class="hidden" style="display: none;">
        <label>Name
          <input name="name" required autocomplete="name" placeholder="Your name">
        </label>
        <label>Email
          <input name="email" type="email" required autocomplete="email" placeholder="you@domain.com">
        </label>
        <label>What do you need?
          <select name="service">
            <option>A website</option>
            <option>An automation</option>
            <option>Custom software</option>
            <option>Not sure yet</option>
          </select>
        </label>
        <label>Tell us a bit about it
          <textarea name="message" placeholder="Briefly describe your idea or prototype need..."></textarea>
        </label>
        <button class="btn" type="submit" id="submitBtn">Request my free prototype</button>
        <div id="ok" role="status"></div>
      </form>
    </div>
  </div>
</section>

<script src="contact.js"></script>
</body>
</html>
