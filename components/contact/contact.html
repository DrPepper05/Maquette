<section id="contact" aria-label="Contact and free prototype inquiry">
  <div class="room" aria-hidden="true"></div>
  <div class="wrap">
    <div class="box">
      <div>
        <span class="eyebrow">Start here</span>
        <h2>Let’s discuss your prototype.</h2>
        <p class="lead">Four short fields. We reply within one working day, usually with a call invitation.</p>
        <p class="mono" style="margin-top: 24px;">hello@maquette.example</p>
      </div>
      <form id="f">
        <label>Name
          <input name="n" required autocomplete="name">
        </label>
        <label>Email
          <input name="e" type="email" required autocomplete="email">
        </label>
        <label>What do you need?
          <select name="service" id="project">
            <option>A website</option>
            <option>An automation</option>
            <option>Custom software</option>
            <option>Not sure yet</option>
          </select>
        </label>
        <label>Tell us a bit about it
          <textarea name="details"></textarea>
        </label>
        <button class="btn" type="submit">Request my free prototype</button>
        <div id="ok" role="status">Preview only: the form is not connected yet. Please email us instead.</div>
      </form>
    </div>
  </div>
</section>
