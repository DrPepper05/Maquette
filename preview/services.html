<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wings / Services preview – Maquette</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../components/services/services.css">
<style>
  /* Standalone preview bar */
  .preview-banner {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255, 176, 32, 0.15);
    border-bottom: 1px solid rgba(255, 176, 32, 0.3);
    backdrop-filter: blur(10px);
    padding: 8px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
  }
  .preview-banner a {
    color: var(--gold);
    text-decoration: none;
    font-weight: 600;
  }
  .preview-banner a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="site-backdrop" id="siteBackdrop" aria-hidden="true">
  <div class="site-room" id="globalRoom"></div>
  <div class="site-grain"></div>
  <div class="site-shade"></div>
</div>
<div class="preview-banner">
  <span>Previewing component: <strong>Wings / Services</strong> (<code>services</code>)</span>
  <a href="index.html">← Back to Component Catalog</a>
</div>
<section id="services" class="services-section" aria-label="The studio services">
  <div class="room" aria-hidden="true"></div>
  <div class="wrap">
    <div class="intro">
      <span class="eyebrow">What we build</span>
      <h2>Three ways we build.</h2>
      <p class="lead">Pick one, or combine them. Every project starts with the same free prototype.</p>
    </div>


    <div id="studioWall" class="studio-wall" aria-label="The Studio Artworks">
      <!-- Liquid cloth cards rendered by services.js -->
    </div>

    <div class="rfoot">
      <span class="sc-count" id="servicesCount">01 — 03 · Three Disciplines</span>
    </div>
  </div>
</section>
<script src="../components/services/services.js"></script>
</body>
</html>
