<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Header Navigation preview – Maquette</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../components/header/header.css">
<style>
  /* Standalone preview bar */
  .preview-banner {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255, 176, 32, 0.15);
    border-bottom: 1px solid rgba(255, 176, 32, 0.3);
    backdrop-filter: blur(10px);
    padding: 8px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
  }
  .preview-banner a {
    color: var(--gold);
    text-decoration: none;
    font-weight: 600;
  }
  .preview-banner a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="site-backdrop" id="siteBackdrop" aria-hidden="true">
  <div class="site-room" id="globalRoom"></div>
  <div class="site-grain"></div>
  <div class="site-shade"></div>
</div>
<div class="preview-banner">
  <span>Previewing component: <strong>Header Navigation</strong> (<code>header</code>)</span>
  <a href="index.html">← Back to Component Catalog</a>
</div>
<header id="siteHeader">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="Maquette">Maquette</a>
    <div class="nav-cluster">
      <nav class="nav-desktop" aria-label="Main Navigation">
        <a href="#work">Collection</a>
        <a href="#services">Services</a>
        <a href="#why">Values</a>
        <a href="#faq">Visitor info</a>
        <a class="cta" href="#contact">Free brand demo</a>
      </nav>
      <a class="nav-mobile-cta cta" href="#contact">Free brand demo</a>
      <button type="button" class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobileDrawer">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
    </div>
  </div>
  <div class="mobile-drawer" id="mobileDrawer" aria-hidden="true">
    <div class="mobile-drawer-inner">
      <div class="mobile-drawer-kicker">Navigation</div>
      <nav class="mobile-nav-links" aria-label="Mobile Navigation">
        <a href="#work" class="mobile-nav-link">
          <span class="m-num">01</span>
          <span class="m-text">Collection</span>
        </a>
        <a href="#services" class="mobile-nav-link">
          <span class="m-num">02</span>
          <span class="m-text">Services</span>
        </a>
        <a href="#why" class="mobile-nav-link">
          <span class="m-num">03</span>
          <span class="m-text">Values</span>
        </a>
        <a href="#faq" class="mobile-nav-link">
          <span class="m-num">04</span>
          <span class="m-text">Visitor info</span>
        </a>
      </nav>
      <div class="mobile-drawer-footer">
        <a class="btn" href="#contact" id="mobileDrawerCta">Get my free brand demo</a>
        <p class="mono mobile-drawer-email"><a href="mailto:contact@maquette.ro">contact@maquette.ro</a></p>
      </div>
    </div>
  </div>
</header>
<script src="../components/header/header.js"></script>
</body>
</html>
