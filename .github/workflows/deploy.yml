# Build Astro și publică dist/ pe GitHub Pages.
# Pages trebuie setat pe „GitHub Actions" (Settings → Pages → Source),
# altfel GitHub rulează build-ul lui Jekyll implicit, care pică pe .astro.
#
# SITE/BASE_PATH: pe github.io site-ul stă sub /Maquette/. Când domeniul
# maquette.ro e activ (custom domain pe Pages), șterge cele două env-uri —
# config-ul revine la valorile implicite (site maquette.ro, base /).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE: https://drpepper05.github.io
      BASE_PATH: /Maquette
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
