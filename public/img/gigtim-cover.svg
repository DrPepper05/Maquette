<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Illustration: a campus street map with location pins and short shift tickets">
  <!-- Maquette house illustration — NOT a product screenshot.
       Short shifts for students: a one-campus street grid, posted shifts
       as tickets, dot-leader lines tying each ticket to a place. Composed
       for the SQUARE album face: lower ~30% stays calm (scrim + title). -->
  <rect width="1000" height="1000" fill="#0F1013"/>

  <!-- street grid -->
  <g stroke="#262B33" stroke-width="2">
    <path d="M160 0v1000M380 0v1000M820 0v1000"/>
    <path d="M0 160h1000M0 820h1000"/>
  </g>
  <g stroke="#3A4048" stroke-width="3">
    <path d="M600 0v1000"/>
    <path d="M0 380h1000"/>
    <path d="M0 600h1000"/>
  </g>

  <!-- the campus block — the one place the plan starts -->
  <rect x="190" y="205" width="240" height="115" rx="12" fill="#14171B" stroke="#262B33" stroke-width="2"/>
  <circle cx="222" cy="262" r="4" fill="#D9573A"/>
  <text x="240" y="267" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="3" fill="#8B8F94">CAMPUS</text>

  <!-- location pins -->
  <g stroke-linecap="round">
    <g stroke="#D9573A" stroke-width="2.5">
      <path d="M600 394v18"/><circle cx="600" cy="380" r="8" fill="#0F1013"/>
      <path d="M820 174v18"/><circle cx="820" cy="160" r="8" fill="#0F1013"/>
      <path d="M380 614v18"/><circle cx="380" cy="600" r="8" fill="#0F1013"/>
    </g>
    <g stroke="#8B8F94" stroke-width="2.5" opacity=".8">
      <path d="M160 394v18"/><circle cx="160" cy="380" r="7" fill="#0F1013"/>
      <path d="M820 614v18"/><circle cx="820" cy="600" r="7" fill="#0F1013"/>
    </g>
  </g>
  <circle cx="600" cy="380" r="3" fill="#D9573A"/>
  <circle cx="820" cy="160" r="3" fill="#D9573A"/>
  <circle cx="380" cy="600" r="3" fill="#D9573A"/>

  <!-- shift tickets: a time bar and two lines of text -->
  <g>
    <g>
      <rect x="430" y="200" width="176" height="72" rx="12" fill="#14171B" stroke="#262B33" stroke-width="2"/>
      <rect x="450" y="218" width="76" height="9" rx="4.5" fill="#D9573A" opacity=".95"/>
      <rect x="450" y="238" width="118" height="6" rx="3" fill="#8B8F94" opacity=".45"/>
      <rect x="450" y="252" width="82" height="6" rx="3" fill="#8B8F94" opacity=".3"/>
    </g>
    <g>
      <rect x="640" y="440" width="176" height="72" rx="12" fill="#14171B" stroke="#262B33" stroke-width="2"/>
      <rect x="660" y="458" width="64" height="9" rx="4.5" fill="#C7CACF" opacity=".85"/>
      <rect x="660" y="478" width="120" height="6" rx="3" fill="#8B8F94" opacity=".45"/>
      <rect x="660" y="492" width="76" height="6" rx="3" fill="#8B8F94" opacity=".3"/>
    </g>
    <g>
      <rect x="140" y="470" width="176" height="72" rx="12" fill="#14171B" stroke="#262B33" stroke-width="2"/>
      <rect x="160" y="488" width="88" height="9" rx="4.5" fill="#C7CACF" opacity=".85"/>
      <rect x="160" y="508" width="112" height="6" rx="3" fill="#8B8F94" opacity=".45"/>
      <rect x="160" y="522" width="70" height="6" rx="3" fill="#8B8F94" opacity=".3"/>
    </g>
  </g>

  <!-- dot leaders: ticket → place (the house leader motif) -->
  <g stroke="#8B8F94" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.1 12" opacity=".7">
    <path d="M560 272 C580 310 592 345 598 368"/>
    <path d="M700 440 C730 380 780 250 814 176"/>
    <path d="M316 520 C340 550 362 575 372 588"/>
  </g>

  <!-- three free hours -->
  <g transform="translate(880,258)">
    <circle r="30" fill="none" stroke="#8B8F94" stroke-width="2.5" opacity=".8"/>
    <path d="M0 -30v8" stroke="#D9573A" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 0v-16M0 0l12 8" stroke="#C7CACF" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- plate caption -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" letter-spacing="3">
    <text x="640" y="106" fill="#D9573A">B</text>
    <text x="662" y="106" fill="#8B8F94">POSTED SATURDAY,</text>
    <text x="662" y="132" fill="#8B8F94">TAKEN TUESDAY</text>
  </g>
</svg>
